<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STPM Study Helper Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px 15px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .subject-select {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            overflow-y: auto;
        }

        .subject-btn {
            padding: 8px 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .subject-btn.active {
            background: #667eea;
            color: white;
        }

        .subject-btn:hover {
            background: #667eea;
            color: white;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 15px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message.bot .message-content {
            background: #f0f0f0;
            color: #333;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 25px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .input-area button:hover {
            background: #764ba2;
        }

        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .loading span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 STPM Study Helper</h1>
            <p>Your AI-powered exam preparation assistant</p>
        </div>

        <div class="subject-select">
            <button class="subject-btn active" data-subject="general">General</button>
            <button class="subject-btn" data-subject="pengajian_perniagaan">Perniagaan</button>
            <button class="subject-btn" data-subject="sains_sukan">Sains Sukan</button>
            <button class="subject-btn" data-subject="pengajian_am">Pengajian Am</button>
            <button class="subject-btn" data-subject="bahasa_melayu">B. Melayu</button>
        </div>

        <div class="chat-box" id="chatBox"></div>

        <div class="input-area">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Ask your study question..." 
                onkeypress="if(event.key === 'Enter') sendMessage()"
            >
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const API_URL = "https://stpm-chatbot-api.onrender.com";
        let selectedSubject = "general";

        document.querySelectorAll(".subject-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".subject-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                selectedSubject = btn.dataset.subject;
            });
        });

        async function sendMessage() {
            const input = document.getElementById("messageInput");
            const message = input.value.trim();

            if (!message) return;

            // Add user message
            addMessage(message, "user");
            input.value = "";
            document.getElementById("sendBtn").disabled = true;

            // Show loading
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "message bot";
            loadingDiv.innerHTML = '<div class="message-content"><div class="loading"><span></span><span></span><span></span></div></div>';
            document.getElementById("chatBox").appendChild(loadingDiv);
            document.getElementById("chatBox").scrollTop = document.getElementById("chatBox").scrollHeight;

            try {
                const response = await fetch(`${API_URL}/chat?message=${encodeURIComponent(message)}&subject=${selectedSubject}`, {
                    method: "POST"
                });

                const data = await response.json();
                
                // Remove loading
                loadingDiv.remove();

                // Add bot response
                if (data.bot_response) {
                    addMessage(data.bot_response, "bot");
                } else {
                    addMessage("Sorry, I couldn't process that. Try again!", "bot");
                }
            } catch (error) {
                loadingDiv.remove();
                addMessage("Error connecting to server. Make sure backend URL is correct!", "bot");
            } finally {
                document.getElementById("sendBtn").disabled = false;
                document.getElementById("messageInput").focus();
            }
        }

        function addMessage(text, sender) {
            const chatBox = document.getElementById("chatBox");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${sender}`;
            messageDiv.innerHTML = `<div class="message-content">${text}</div>`;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
